- id: '1788192830765'
  alias: 'Вентиляція: Автовимкнення витяжки в туалеті через 4 хв'
  description: Автоматично вимикає реле витяжки після 4 хвилин безперервної роботи
  triggers:
  - entity_id: switch.ventiliatort_vimikach_1
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - delay:
      minutes: 4
  - action: switch.turn_off
    target:
      entity_id: switch.ventiliatort_vimikach_1
  mode: restart
- id: '1788194060757'
  alias: 'Бойлер: Розклад + Захист мережі + Резервне живлення'
  description: 'Вікна: ніч 04:00-07:00 і 23:00-00:30, вечір за помічниками input_datetime.boiler_vechirnie_vikno_pochatok
    / _kinets (з 27.11 20:30-21:30, раніше 19:30-21:30; до 08.10 обід 13:00-14:00).
    Захист: ввід понад 6 кВт, напруга нижче 190 В або недоступна. P5b (27.11.2026):
    бойлер на загальній лінії розеток, тому вмикання лише в стані «Мережа» (input_select.stan_zhivlennia),
    вимкнення в будь-якому іншому. Перевірка кожні 5 хв у вікні: вмикає бойлер, якщо
    розетка перезавантажилась у вимкнений стан. 27.11: вмикання лише якщо живлення
    квартири стабільне 6 хв (захист від роботи від станції в перші хвилини після перемикання
    на резерв); періодична перевірка без запису в журнал, коли вмикати нічого.'
  triggers:
  - above: 6
    entity_id: sensor.vvidnii_shchitok_zhivlennia
    for:
      seconds: 5
    id: turn_off_event
    trigger: numeric_state
  - below: 190
    entity_id: sensor.vvidnii_shchitok_napruga
    id: turn_off_event
    trigger: numeric_state
  - entity_id: sensor.vvidnii_shchitok_napruga
    id: turn_off_event
    to:
    - unavailable
    - unknown
    trigger: state
  - entity_id: input_select.stan_zhivlennia
    id: turn_off_event
    not_to: Мережа
    trigger: state
  - at: 07:00:00
    id: turn_off_event
    trigger: time
  - at: input_datetime.boiler_vechirnie_vikno_kinets
    id: turn_off_event
    trigger: time
  - at: 00:30:00
    id: turn_off_event
    trigger: time
  - at: 04:00:00
    id: try_turn_on
    trigger: time
  - at: input_datetime.boiler_vechirnie_vikno_pochatok
    id: try_turn_on
    trigger: time
  - at: '23:00:00'
    id: try_turn_on
    trigger: time
  - below: 3.5
    entity_id: sensor.vvidnii_shchitok_zhivlennia
    for:
      minutes: 1
    id: try_turn_on
    trigger: numeric_state
  - above: 195
    entity_id: sensor.vvidnii_shchitok_napruga
    for:
      minutes: 1
    id: try_turn_on
    trigger: numeric_state
  - entity_id: sensor.vvidnii_shchitok_napruga
    for:
      minutes: 1
    from:
    - unavailable
    - unknown
    id: try_turn_on
    trigger: state
  - event: start
    id: try_turn_on
    trigger: homeassistant
  - entity_id: input_select.stan_zhivlennia
    for:
      minutes: 1
    id: try_turn_on
    to: Мережа
    trigger: state
  - id: periodic
    minutes: /5
    trigger: time_pattern
  conditions:
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: trigger
        id: periodic
    - condition: and
      conditions:
      - condition: state
        entity_id: input_select.stan_zhivlennia
        for:
          minutes: 1
        state: Мережа
      - condition: state
        entity_id: switch.boiler
        state: 'off'
      - condition: or
        conditions:
        - after: 04:00:00
          before: 07:00:00
          condition: time
        - after: input_datetime.boiler_vechirnie_vikno_pochatok
          before: input_datetime.boiler_vechirnie_vikno_kinets
          condition: time
        - after: '23:00:00'
          before: 00:30:00
          condition: time
      - above: 190
        condition: numeric_state
        entity_id: sensor.vvidnii_shchitok_napruga
      - below: 3.8
        condition: numeric_state
        entity_id: sensor.vvidnii_shchitok_zhivlennia
      - alias: Живлення квартири стабільне 6 хв (не було перемикань I-0-II)
        condition: template
        value_template: '{{ states(''binary_sensor.system_monitor_charging'') != ''off''
          and (now() - states.binary_sensor.system_monitor_charging.last_changed).total_seconds()
          > 360 }}'
  actions:
  - choose:
    - alias: Вимкнення (захист, кінець вікна, не мережа)
      conditions:
      - condition: trigger
        id: turn_off_event
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.boiler
    - alias: Спроба вмикання
      conditions:
      - condition: trigger
        id: try_turn_on
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state: Мережа
      - condition: or
        conditions:
        - after: 04:00:00
          before: 07:00:00
          condition: time
        - after: input_datetime.boiler_vechirnie_vikno_pochatok
          before: input_datetime.boiler_vechirnie_vikno_kinets
          condition: time
        - after: '23:00:00'
          before: 00:30:00
          condition: time
      - above: 190
        condition: numeric_state
        entity_id: sensor.vvidnii_shchitok_napruga
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: state
            entity_id: switch.boiler
            state: 'on'
          - below: 6
            condition: numeric_state
            entity_id: sensor.vvidnii_shchitok_zhivlennia
        - condition: and
          conditions:
          - condition: state
            entity_id: switch.boiler
            state: 'off'
          - below: 3.8
            condition: numeric_state
            entity_id: sensor.vvidnii_shchitok_zhivlennia
      - alias: Живлення квартири стабільне 6 хв (не було перемикань I-0-II)
        condition: template
        value_template: '{{ states(''binary_sensor.system_monitor_charging'') != ''off''
          and (now() - states.binary_sensor.system_monitor_charging.last_changed).total_seconds()
          > 360 }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.boiler
    - alias: 'Періодична перевірка: бойлер вимкнений у вікні при нормальних умовах'
      conditions:
      - condition: trigger
        id: periodic
      - condition: state
        entity_id: input_select.stan_zhivlennia
        for:
          minutes: 1
        state: Мережа
      - condition: state
        entity_id: switch.boiler
        state: 'off'
      - condition: or
        conditions:
        - after: 04:00:00
          before: 07:00:00
          condition: time
        - after: input_datetime.boiler_vechirnie_vikno_pochatok
          before: input_datetime.boiler_vechirnie_vikno_kinets
          condition: time
        - after: '23:00:00'
          before: 00:30:00
          condition: time
      - above: 190
        condition: numeric_state
        entity_id: sensor.vvidnii_shchitok_napruga
      - below: 3.8
        condition: numeric_state
        entity_id: sensor.vvidnii_shchitok_zhivlennia
      - alias: Живлення квартири стабільне 6 хв (не було перемикань I-0-II)
        condition: template
        value_template: '{{ states(''binary_sensor.system_monitor_charging'') != ''off''
          and (now() - states.binary_sensor.system_monitor_charging.last_changed).total_seconds()
          > 360 }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.boiler
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.boiler
  mode: restart
  trace:
    stored_traces: 20
- id: '1788196072682'
  alias: 'Електромережа: Превентивні сповіщення TOMZN'
  description: Попереджає про наближення до критичних меж до спрацювання захисту
  triggers:
  - entity_id: sensor.vvidnii_shchitok_napruga
    above: 245
    for:
      seconds: 10
    id: warn_high_voltage
    trigger: numeric_state
  - entity_id: sensor.vvidnii_shchitok_napruga
    below: 195
    for:
      seconds: 10
    id: warn_low_voltage
    trigger: numeric_state
  - entity_id: sensor.vvidnii_shchitok_napruga
    above: 200
    below: 240
    for:
      seconds: 30
    id: normal_voltage
    trigger: numeric_state
  - entity_id:
    - sensor.vvidnii_shchitok_zhivlennia
    above: 6
    for:
      seconds: 30
    id: warn_overload
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: warn_high_voltage
      sequence:
      - data:
          title: ⚠️ Напруга зростає!
          message: Вже {{ states('sensor.vvidnii_shchitok_napruga') }} В. Наближається
            до межі відключення (253 В).
          data:
            tag: grid_voltage_alert
            ttl: 0
            priority: high
        action: notify.mobile_app_cph2737
    - conditions:
      - condition: trigger
        id: warn_low_voltage
      sequence:
      - data:
          title: ⚠️ Напруга падає!
          message: Вже {{ states('sensor.vvidnii_shchitok_napruga') }} В. Просідає
            до межі відключення (183 В).
          data:
            tag: grid_voltage_alert
            ttl: 0
            priority: high
        action: notify.mobile_app_cph2737
    - conditions:
      - condition: trigger
        id: normal_voltage
      sequence:
      - data:
          title: ✅ Напруга стабілізувалася
          message: 'Параметри в нормі: {{ states(''sensor.vvidnii_shchitok_napruga'')
            }} В.'
          data:
            tag: grid_voltage_alert
        action: notify.mobile_app_cph2737
    - conditions:
      - condition: trigger
        id: warn_overload
      sequence:
      - data:
          title: '⚡ Увага: Високе навантаження!'
          message: 'Споживання: {{ (states(''sensor.vvidnii_shchitok_zhivlennia'')
            | float(0) * 1000) | round(0) }} Вт (Струм: {{ states(''sensor.vvidnii_shchitok_strum'')
            }} А). Вимкни потужні прилади, щоб не вибило автомат 32А.'
          data:
            priority: high
        action: notify.mobile_app_cph2737
  mode: parallel
  max: 10
- id: '1788198348341'
  alias: 'Сервер: Комплексний моніторинг живлення ультрабука'
  description: 'Сповіщення про відключення 220V, відновлення живлення, 50% і критичний
    розряд (25%) батареї. P5b (27.11.2026): додано поріг 50%.'
  triggers:
  - entity_id: binary_sensor.system_monitor_charging
    to: 'off'
    for:
      seconds: 10
    id: power_lost
    trigger: state
  - entity_id: binary_sensor.system_monitor_charging
    to: 'on'
    for:
      seconds: 5
    id: power_restored
    trigger: state
  - entity_id: sensor.system_monitor_battery
    below: 25
    for:
      minutes: 1
    id: low_battery
    trigger: numeric_state
  - entity_id: sensor.system_monitor_battery
    below: 50
    for:
      minutes: 1
    id: battery_50
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: power_lost
      sequence:
      - data:
          title: "\U0001F50B Сервер на батареї!"
          message: 'Ультрабук відключено від мережі. Заряд: {{ states(''sensor.system_monitor_battery'')
            }}%.'
          data:
            tag: server_power_status
            priority: high
        action: notify.mobile_app_cph2737
    - conditions:
      - condition: trigger
        id: power_restored
      sequence:
      - data:
          title: ⚡ Сервер підключено до мережі
          message: Живлення відновлено, ультрабук заряджається ({{ states('sensor.system_monitor_battery')
            }}%).
          data:
            tag: server_power_status
        action: notify.mobile_app_cph2737
    - conditions:
      - condition: trigger
        id: low_battery
      sequence:
      - data:
          title: "\U0001FAAB Критичний заряд сервера!"
          message: 'Заряд ультрабука менше 25% (зараз: {{ states(''sensor.system_monitor_battery'')
            }}%). Підключи станцію або зарядне, щоб HA не вимкнувся!'
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_cph2737
    - conditions:
      - condition: trigger
        id: battery_50
      - condition: state
        entity_id: binary_sensor.system_monitor_charging
        state: 'off'
      sequence:
      - action: notify.mobile_app_cph2737
        data:
          title: "\U0001F50B Сервер: 50% заряду"
          message: Ультрабук на батареї, заряд {{ states("sensor.system_monitor_battery")
            }}%. До вимкнення HA приблизно година. Перемкніть квартиру на резерв.
          data:
            priority: high
            tag: server_battery_50
  mode: parallel
  max: 5
- id: switch_electricity_tariff
  alias: 'Енергооблік: Перемикання тарифів День/Ніч'
  description: Перемикання зон о 23:00 і 07:00 та звірка зони після старту HA
  triggers:
  - trigger: time
    at: '23:00:00'
  - trigger: time
    at: 07:00:00
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - variables:
      target_zone: '{{ ''day'' if today_at(''07:00'') <= now() < today_at(''23:00'')
        else ''night'' }}'
  - condition: template
    value_template: '{{ states(''select.merezha_dvozonnii'') != target_zone }}'
  - action: select.select_option
    target:
      entity_id: select.merezha_dvozonnii
    data:
      option: '{{ target_zone }}'
  mode: single
- id: '1788904185874'
  alias: 'River 600W: Розрахунок заряду та калібрування'
  description: Динамічний приріст (дільник 14.22), реальний розряд із самоспоживанням
    (-1.95%/15хв) та калібрування на 80%
  triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: numeric_state
    entity_id: sensor.river_600_in_zhivlennia
    below: 10
    for:
      minutes: 5
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.river_600_in_zhivlennia
        below: 10
      - condition: numeric_state
        entity_id: sensor.river_600_in_zhivlennia
        above: 0.1
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.zariad_river_600
        data:
          value: 80
    - conditions:
      - condition: numeric_state
        entity_id: sensor.river_600_in_zhivlennia
        above: 20
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.zariad_river_600
        data:
          value: '{% set pwr = states(''sensor.river_600_in_zhivlennia'') | float(0)
            %} {% set cur = states(''input_number.zariad_river_600'') | float(0) %}
            {% set gained = pwr / 14.22 %} {{ [ (cur + gained) | round(0), 80 ] |
            min }}'
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.river_600_in_zhivlennia') in ['unavailable',
          'unknown'] \n   or states('sensor.river_600_in_zhivlennia') | float(0) <
          1 }}"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.zariad_river_600
        data:
          value: '{{ [ (states(''input_number.zariad_river_600'') | float(80) - 3.08)
            | round(1), 0 ] | max }}'
  mode: single
- id: '1788942460808'
  alias: 'River 600W: Сповіщення про низький заряд та живлення'
  description: Надсилає push-сповіщення на пристрій cph2737 при розряді або вимкненні
    розетки
  triggers:
  - trigger: numeric_state
    entity_id: input_number.zariad_river_600
    below: 46
    id: low_battery
  - trigger: state
    entity_id: sensor.river_600_in_zhivlennia
    to: unavailable
    for:
      minutes: 5
    id: plug_lost
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: low_battery
      sequence:
      - action: notify.mobile_app_cph2737
        data:
          title: '⚠️ EcoFlow River: Критичний заряд!'
          message: Заряд River впав до {{ states('input_number.zariad_river_600')
            }}%! Роутер, термінал і камера скоро згаснуть.
          data:
            ttl: 0
            priority: high
    - conditions:
      - condition: trigger
        id: plug_lost
      sequence:
      - action: notify.mobile_app_cph2737
        data:
          title: '⚠️ EcoFlow River: Втрата контакту з розеткою'
          message: Розетка недоступна більше 5 хв. Перевір, чи добре вставлений штепсель!
          data:
            ttl: 0
            priority: high
  mode: single
- id: '1788943914924'
  alias: 'River 600W: Захист живлення розетки (Watchdog)'
  description: 'Примусово тримає розетку увімкненою завжди, коли в місті є електроенергія.
    27.11: перевірка кожні 2 хв, бо після перезавантаження розетки (перемикання I-0-II)
    команда увімкнення може загубитися, а стан у HA лишається off без змін.'
  triggers:
  - trigger: state
    entity_id: switch.river_600_in
    to: 'off'
    for:
      seconds: 5
  - trigger: state
    entity_id: switch.river_600_in
    from:
    - unavailable
    - unknown
    for:
      seconds: 5
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: input_boolean.rezhim_blekautu
    to: 'off'
  - trigger: time_pattern
    minutes: /2
  conditions:
  - condition: state
    entity_id: input_boolean.rezhim_blekautu
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.vvidnii_shchitok_napruga
    above: 190
  - condition: not
    conditions:
    - condition: state
      entity_id: switch.river_600_in
      state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.river_600_in
  mode: restart
- id: '1789034016958'
  alias: 'Безпека: Сповіщення про витік води (закріплене)'
  description: Тривога по воді з блокуванням змахування та миттєвим повтором при спробі
    закрити
  triggers:
  - entity_id: binary_sensor.datchik_vitoku_vodi_water_leak
    to: 'on'
    id: leak_start
    trigger: state
  - event_type: mobile_app_notification_cleared
    event_data:
      tag: water_leak_alert
    id: dismissed_by_user
    trigger: event
  - entity_id: binary_sensor.datchik_vitoku_vodi_water_leak
    to: 'off'
    id: leak_cleared
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: leak_start
        - condition: and
          conditions:
          - condition: trigger
            id: dismissed_by_user
          - condition: state
            entity_id: binary_sensor.datchik_vitoku_vodi_water_leak
            state: 'on'
      sequence:
      - action: notify.mobile_app_cph2737
        data:
          title: "\U0001F6A8 АВАРІЯ! ВИТІК ВОДИ НЕ УСУНЕНО!"
          message: Датчик все ще у воді! Сповіщення не зникне, доки контакти не висохнуть.
          data:
            tag: water_leak_alert
            persistent: true
            sticky: true
            channel: alarm_stream
            importance: high
            priority: high
            ttl: 0
            color: '#ff0000'
            notification_icon: mdi:water-alert
    - conditions:
      - condition: trigger
        id: leak_cleared
      sequence:
      - action: notify.mobile_app_cph2737
        data:
          message: clear_notification
          data:
            tag: water_leak_alert
      - action: notify.mobile_app_cph2737
        data:
          title: ✅ Витік ліквідовано
          message: Датчик води знову сухий. Все в нормі.
  mode: restart
- id: '1789035354269'
  alias: 'Клімат: Розумна вентиляція у ванні (Derivative)'
  description: Динамічний запуск витяжки по швидкості стрибка вологості з розумним
    вимкненням по стабілізації/порогу та таймером безпеки
  triggers:
  - entity_id: sensor.vanna_datchik_klimatu_shvidkist_zmini_vologosti_u_vanni
    above: 1.5
    id: hum_spike
    trigger: numeric_state
  - entity_id: sensor.datchik_klimatu_humidity
    above: 70
    id: hum_high
    trigger: numeric_state
  - entity_id: sensor.datchik_klimatu_humidity
    below: 50
    for:
      minutes: 1
    id: hum_normal
    trigger: numeric_state
  - entity_id: sensor.vanna_datchik_klimatu_shvidkist_zmini_vologosti_u_vanni
    above: -0.2
    for:
      minutes: 2
    id: hum_stabilized
    trigger: numeric_state
  - entity_id: switch.ventiliatorv_vimikach_1
    to: 'on'
    for:
      minutes: 25
    id: safety_timeout
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: hum_spike
        - condition: trigger
          id: hum_high
      - condition: state
        entity_id: switch.ventiliatorv_vimikach_1
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.ventiliatorv_vimikach_1
    - conditions:
      - condition: state
        entity_id: switch.ventiliatorv_vimikach_1
        state: 'on'
      - condition: or
        conditions:
        - condition: trigger
          id: hum_normal
        - condition: trigger
          id: safety_timeout
        - condition: and
          conditions:
          - condition: trigger
            id: hum_stabilized
          - condition: numeric_state
            entity_id: sensor.datchik_klimatu_humidity
            below: 65
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.ventiliatorv_vimikach_1
  mode: restart
- id: '1789036104875'
  alias: 'Клімат: Профілактичний продув ванної'
