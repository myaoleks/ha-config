- id: '1789250756391'
  alias: 'Telegram Assist: Текстові команди'
  description: Передає запити з Telegram у Gemini Assist із живим зрізом системи та
    аналізом логів
  triggers:
  - event_type: telegram_text
    trigger: event
  conditions: []
  actions:
  - action: conversation.process
    data:
      agent_id: conversation.google_ai_conversation
      text: "{# 1. АУДИТ АВТОМАТИЗАЦІЙ #} {% set never = states.automation | selectattr('attributes.last_triggered',
        'none') | map(attribute='name') | list %} {% set ns = namespace(recent=[])
        %} {% for a in states.automation | selectattr('attributes.last_triggered',
        'defined') | rejectattr('attributes.last_triggered', 'none') | sort(attribute='attributes.last_triggered',
        reverse=true) %}\n  {% if loop.index <= 4 %}\n    {% set t = as_timestamp(a.attributes.last_triggered)
        | timestamp_custom('%d.%m %H:%M', true) %}\n    {% set ns.recent = ns.recent
        + [a.name ~ ' (' ~ t ~ ')'] %}\n  {% endif %}\n{% endfor %}\n{# 2. СЕРВІС
        ТА БАТАРЕЙКИ (Zigbee датчики < 25%) #} {% set low_bat_list = namespace(devices=[])
        %} {% for s in states.sensor if s.attributes.device_class | default('') ==
        'battery' and s.state not in ['unavailable', 'unknown'] and s.state | int(100)
        < 25 %}\n  {% set low_bat_list.devices = low_bat_list.devices + [s.name ~
        ': ' ~ s.state ~ '%'] %}\n{% endfor %}\n{# 3. ЕНЕРГЕТИКА ТА ПАРАМЕТРИ МЕРЕЖІ
        #} {% set power_sensors = states.sensor \n  | selectattr('attributes.device_class',
        'defined') \n  | selectattr('attributes.device_class', 'in', ['voltage', 'current',
        'power', 'energy']) \n  | rejectattr('state', 'in', ['unavailable', 'unknown'])
        %}\n{% set p_list = namespace(items=[]) %} {% for p in power_sensors %}\n
        \ {% if loop.index <= 8 %}\n    {% set p_list.items = p_list.items + [p.name
        ~ ': ' ~ p.state ~ ' ' ~ p.attributes.unit_of_measurement | default('')] %}\n
        \ {% endif %}\n{% endfor %}\n{# 4. СЕРВІСНІ СЕНСОРИ РОБІКА #} {% set maint
        = states.sensor \n  | selectattr('entity_id', 'search', 'robik|dust_bag|filter|maintenance')
        \n  | rejectattr('state', 'in', ['unavailable', 'unknown']) \n  | map(attribute='name')
        | list %}\n\n{# 5. ЖУРНАЛ СИСТЕМНИХ ПОМИЛОК ТА ПОПЕРЕДЖЕНЬ (Зріз із системного
        логера) #} {% set log_err = states('sensor.system_log_error') | default('0')
        %} {% set log_warn = states('sensor.system_log_warning') | default('0') %}
        {% set last_err = state_attr('sensor.system_log_error', 'message') | default('Не
        зафіксовано критичних збоїв') %}\n[ЖИВИЙ СИСТЕМНИЙ ЗРІЗ HOME ASSISTANT]: -
        Автоматизації без запуску: {{ never | join(', ') if never | length > 0 else
        'Усі запускалися' }} - Останні спрацювання: {{ ns.recent | join('; ') }} -
        Мережа та живлення: {{ p_list.items | join('; ') if p_list.items | length
        > 0 else 'Немає активних показників' }} - Батарейки Zigbee (<25%): {{ low_bat_list.devices
        | join(', ') if low_bat_list.devices | length > 0 else 'Усі заряди в нормі'
        }} - Статус сервісних ресурсів (РОБІК/фільтри): {{ maint | join(', ') if maint
        | length > 0 else 'Дані відсутні' }} - Журнал системи: Помилок: {{ log_err
        }}, Попереджень: {{ log_warn }}. Останній запис: {{ last_err }}\n[ІНСТРУКЦІЯ
        ДЛЯ АНАЛІЗУ ПОМИЛОК]: Якщо у блоці логів зафіксовано помилки або попередження:
        1. Зрозуміло поясни причину виникнення помилки (чому вона сталася). 2. Запропонуй
        конкретні рекомендації або готовий фрагмент YAML-коду для усунення. 3. Нагадай,
        що зміни слід внести вручну, оскільки ти працюєш у режимі Read-Only.\n[ЗАПИТ
        КОРИСТУВАЧА]: {{ trigger.event.data.text }}"
    response_variable: assist_response
  - action: telegram_bot.send_message
    data:
      chat_id: '{{ trigger.event.data.chat_id }}'
      message: '{{ assist_response.response.speech.plain.speech }}'
      parse_mode: plain_text
  mode: queued
  max: 10
- id: '1789259042386'
  alias: 'Сервіс: Щотижневий інженерний аудит системи'
  description: Щонеділі о 09:00 розширений аудит логів, місячної енергетики в гривнях
    та витратників у Telegram
  triggers:
  - trigger: time
    at: 09:00:00
  conditions:
  - condition: time
    weekday:
    - sun
  actions:
  - action: conversation.process
    data:
      agent_id: conversation.google_ai_conversation
      text: "{# 1. ЕНЕРГЕТИКА ТА ФІНАНСИ ЗА МІСЯЦЬ #} {% set m_day = states('sensor.koridor_vkhid_vvidnii_shchitok_merezha_dvozonnii_day')
        | float(0) | round(2) %} {% set m_night = states('sensor.koridor_vkhid_vvidnii_shchitok_merezha_dvozonnii_night')
        | float(0) | round(2) %} {% set m_total = (m_day + m_night) | round(2) %}
        {% set cost_day = (m_day * 4.32) | round(2) %} {% set cost_night = (m_night
        * 2.16) | round(2) %} {% set cost_total = (cost_day + cost_night) | round(2)
        %}\n{# Окремі прилади (накопичено) #} {% set e_boiler = states('sensor.tualet_boiler_energiia_rozrakhunok')
        | float(0) | round(1) %} {% set e_washer = states('sensor.vanna_pralka_energiia_rozrakhunok')
        | float(0) | round(2) %} {% set e_river = states('sensor.river_600w_rozetka_energiia')
        | default('0') %} {% set e_vampire = states('sensor.enerdzhivampir_energiia')
        | default('0') %}\n{# 2. СИСТЕМНІ ЛОГИ #} {% set log_err = states('sensor.system_log_error')
        | default('0') %} {% set log_warn = states('sensor.system_log_warning') |
        default('0') %} {% set last_err_msg = state_attr('sensor.system_log_error',
        'message') | default('Помилок немає') %} {% set last_err_src = state_attr('sensor.system_log_error',
        'source') | default('Невідомо') %}\n{# 3. ВИТРАТНИКИ РОБІКА ТА БАТАРЕЙКИ #}
        {% set low_bat = namespace(devices=[]) %} {% for s in states.sensor if s.attributes.device_class
        | default('') == 'battery' and s.state not in ['unavailable', 'unknown'] and
        s.state | int(100) < 25 %}\n  {% set low_bat.devices = low_bat.devices + [s.name
        ~ ': ' ~ s.state ~ '%'] %}\n{% endfor %}  {% set r = states('sensor.filtr_vodi_zalishok_resursu')
        | int(100) %} {% if r > 40 %}\U0001F7E2{% elif r > 15 %}\U0001F7E1{% else
        %}\U0001F534{% endif %} <b>Фільтр води:</b> {{ r }}% (залишилось {{ states('sensor.filtr_vodi_dniv_do_zamini')
        }} дн. |  ~{{states('sensor.filtr_vodi_propushcheno_vodi') }} м³)\n{% set
        robik_maint = namespace(items=[]) %} {% for s in states.sensor if ('robik'
        in s.entity_id or 'dreame' in s.entity_id) and ('dust_bag' in s.entity_id
        or 'filter' in s.entity_id or 'brush' in s.entity_id or 'sensor_dirty' in
        s.entity_id or 'wheel_dirty' in s.entity_id) and ('time_left' not in s.entity_id)
        and s.state not in ['unavailable', 'unknown'] %}\n  {% set robik_maint.items
        = robik_maint.items + [s.name ~ ': ' ~ s.state ~ '%'] %}\n{% endfor %}\n{#
        4. АВТОМАТИЗАЦІЇ #} {% set never = states.automation | selectattr('attributes.last_triggered',
        'none') | map(attribute='name') | list %}\n[ТЕХНІЧНА ТЕЛЕМЕТРІЯ]: - Енергетика
        за поточний місяць: Всього: {{ m_total }} kWh. День (4.32 грн): {{ m_day }}
        kWh = {{ cost_day }} грн. Ніч (2.16 грн): {{ m_night }} kWh = {{ cost_night
        }} грн. Разом за місяць: {{ cost_total }} грн. - Прилади (накопичено): Бойлер:
        {{ e_boiler }} kWh, Пралка: {{ e_washer }} kWh, EcoFlow: {{ e_river }} kWh,
        Холодильник: {{ e_vampire }} kWh. - Журнал помилок: Всього Errors: {{ log_err
        }}, Warnings: {{ log_warn }}. Останній інцидент: [{{ last_err_src }}]: {{
        last_err_msg }}. - Батарейки низькі: {{ low_bat.devices | join(', ') if low_bat.devices
        | length > 0 else 'В нормі' }}. - Станція Dreame L40s: {{ robik_maint.items
        | join('; ') }}. - Неактивні автоматизації: {{ never | join(', ') if never
        | length > 0 else 'Усі запускалися' }}\n[ІНЖЕНЕРНЕ ЗАВДАННЯ ДЛЯ ШІ]: Ти —
        Senior DevOps інженер розумного будинку. Сформуй щотижневий інженерний звіт
        для власника в Telegram. Використовуй виключно валідні HTML-теги: <b>жирний</b>,
        <code>код/сутність</code>, <i>курсив</i>, емодзі.  УВАГА: Не використовуй
        математичні знаки менше або більше поза тегами, пиши словами (наприклад 'менше
        25%').\nСтруктура звіту: 1. \U0001F6E0 <b>СТАТУС ЗДОРОВ'Я СИСТЕМИ:</b> Лаконічний
        вердикт. 2. \U0001F4B0 <b>ЕНЕРГЕТИКА ТА ФІНАНСИ (ВІД ПОЧАТКУ МІСЯЦЯ):</b>\n
        \  - Загальні витрати у кіловатах та сума у гривнях.\n   - Розбивка: ☀️ День
        (кВт·год / грн) vs \U0001F319 Ніч (кВт·год / грн).\n   - Стан окремих лічильників
        (Бойлер, Пралка, Холодильник, EcoFlow).\n3. \U0001F6A8 <b>АНАЛІЗ СИСТЕМНИХ
        ПОМИЛОК ТА ЛОГІВ:</b>\n   - Рейтинг критичності: \U0001F534 [ВИСОКИЙ] / \U0001F7E1
        [СЕРЕДНІЙ] / \U0001F7E2 [НИЗЬКИЙ].\n   - Розбір джерела [{{ last_err_src }}]
        та конкретний Action Plan для усунення.\n4. \U0001F50B <b>ВИТРАТНИКИ ТА СЕРВІС:</b>\n
        \  - Батарейки Zigbee.\n   - Стан Dreame (стан датчиків, щіток, коліс та фільтрів).\n5.
        ⚙️ <b>АВТОМАТИЗАЦІЇ:</b> Статус сценаріїв."
    response_variable: assist_response
  - action: telegram_bot.send_message
    data:
      chat_id: 605056541
      message: '{{ assist_response.response.speech.plain.speech }}'
      parse_mode: html
  - action: input_button.press
    target:
      entity_id: input_button.skidannia_logiv
  - action: system_log.clear
  mode: single
- id: '1792128742107'
  alias: 'Електромережа: Дії та сповіщення блекауту'
  description: 'P5b (27.11.2026). Не визначає стан сама: реагує на переходи input_select.stan_zhivlennia
    (автоматизація «Електромережа: Стан живлення») і активну станцію. Дії: вимкнення
    бойлера, River і сушіння, стоп робота, дозаряд River (45→80%) на резерві, блокування
    бойлера поза станом Мережа, перевантаження S1 понад 1000 Вт, заряд активної станції
    20/10%, нагадування. Повідомлення в Telegram.'
  triggers:
  - entity_id: input_select.stan_zhivlennia
    id: perehid
    to:
    trigger: state
  - entity_id: input_select.aktivna_stantsiia
    id: stantsiia
    to:
    - Delta 2
    - Delta 2 Max
    - ZEGOR
    trigger: state
  - above: 1000
    entity_id: sensor.rezerv_s1_zhivlennia
    for:
      seconds: 15
    id: overload
    trigger: numeric_state
  - entity_id: switch.boiler
    id: boiler_on
    to: 'on'
    trigger: state
  - below: 46
    entity_id: input_number.zariad_river_600
    id: river_low
    trigger: numeric_state
  - above: 79
    entity_id: input_number.zariad_river_600
    id: river_charged
    trigger: numeric_state
  - below: 21
    entity_id: sensor.garderobna_delta_2_ble_battery_level
    id: soc_delta2_20
    trigger: numeric_state
  - below: 11
    entity_id: sensor.garderobna_delta_2_ble_battery_level
    id: soc_delta2_10
    trigger: numeric_state
  - below: 21
    entity_id: sensor.delta_2_max_battery_level
    id: soc_delta2max_20
    trigger: numeric_state
  - below: 11
    entity_id: sensor.delta_2_max_battery_level
    id: soc_delta2max_10
    trigger: numeric_state
  - below: 21
    entity_id: input_number.zegor_zariad
    id: soc_zegor_20
    trigger: numeric_state
  - below: 11
    entity_id: input_number.zegor_zariad
    id: soc_zegor_10
    trigger: numeric_state
  - id: nahaduvannia
    minutes: /15
    trigger: time_pattern
  - entity_id: input_select.stan_zhivlennia
    for:
      minutes: 10
    id: blekaut_10hv
    to: Блекаут
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: trigger
        id: nahaduvannia
    - condition: state
      entity_id: input_select.stan_zhivlennia
      state: Резерв (мережа є)
  actions:
  - choose:
    - alias: Перехід → Блекаут
      conditions:
      - condition: trigger
        id: perehid
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state: Блекаут
      sequence:
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: "{% if frm == 'Мережа' %}\U0001F6A8 <b>МІСЬКУ МЕРЕЖУ ЗНЕСТРУМЛЕНО!</b>
            Бойлер, River і сушіння вимкнено, робота зупинено.\n\U0001F4CB <b>Дії:</b>
            1. Увімкніть станцію і підключіть її через S1. 2. Переведіть перемикач
            I-0-II у положення <b>РЕЗЕРВ</b>. 3. Вимкніть сушарки. 4. Не вмикайте
            чергове світло у ванній (30 Вт).\n<i>Сервер: {{ bat }}%.</i>{% else %}⚠️
            <b>КВАРТИРА БЕЗ ЖИВЛЕННЯ!</b> Станція вимкнулась, розрядилась або перемикач
            у положенні 0.{% if grid_now %} Міська мережа є ({{ v_now }} В): переведіть
            I-0-II на <b>МЕРЕЖУ</b>.{% else %} Підключіть іншу станцію через S1.{%
            endif %}\n<i>Сервер: {{ bat }}%.</i>{% endif %}"
          parse_mode: html
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id:
          - switch.boiler
          - switch.river_600_in
          - switch.robik_2_0_auto_drying
      - action: vacuum.stop
        continue_on_error: true
        target:
          entity_id: vacuum.robik_2_0
    - alias: Перехід → Резерв
      conditions:
      - condition: trigger
        id: perehid
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state: Резерв
      sequence:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.boiler
      - else:
        - action: switch.turn_off
          continue_on_error: true
          target:
            entity_id: switch.river_600_in
        if:
        - below: 46
          condition: numeric_state
          entity_id: input_number.zariad_river_600
        then:
        - action: switch.turn_on
          continue_on_error: true
          target:
            entity_id: switch.river_600_in
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: "{% if frm == 'Резерв (мережа є)' %}⚠️ <b>МЕРЕЖА ЗНОВУ ЗНИКЛА.</b>
            Залишайтесь на резерві ({{ station }}).{% else %}\U0001F50B <b>КВАРТИРА
            НА РЕЗЕРВІ.</b> Станція: {{ station }}. Бойлер заблоковано.{% if station
            not in ['Delta 2', 'Delta 2 Max', 'ZEGOR'] %} Станцію визначу автоматично.{%
            endif %}{% endif %}"
          parse_mode: html
    - alias: Перехід → Резерв (мережа є)
      conditions:
      - condition: trigger
        id: perehid
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state: Резерв (мережа є)
      sequence:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.boiler
      - if:
        - condition: template
          value_template: '{{ frm == ''Мережа'' }}'
        then:
        - else:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: switch.river_600_in
          if:
          - below: 46
            condition: numeric_state
            entity_id: input_number.zariad_river_600
          then:
          - action: switch.turn_on
            continue_on_error: true
            target:
              entity_id: switch.river_600_in
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: "{% if frm == 'Мережа' %}\U0001F50B <b>КВАРТИРА ЖИВИТЬСЯ ВІД СТАНЦІЇ,
            ХОЧА МЕРЕЖА Є.</b> Бойлер заблоковано. Коли закінчите, переведіть I-0-II
            на <b>МЕРЕЖУ</b>.{% else %}\U0001F7E2 <b>МЕРЕЖА ПОВЕРНУЛАСЬ</b> ({{ v_now
            }} В). Квартира досі на станції ({{ station }}).\n\U0001F449 Переведіть
            перемикач <b>I-0-II</b> у положення <b>МЕРЕЖА</b>.{% endif %}"
          parse_mode: html
    - alias: Перехід → Мережа (вихід з блекауту)
      conditions:
      - condition: trigger
        id: perehid
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state: Мережа
      sequence:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id:
          - switch.river_600_in
          - switch.robik_2_0_auto_drying
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: "{% if res_used %}\U0001F389 <b>ПЕРЕМИКАННЯ НА МЕРЕЖУ ЗАФІКСОВАНО.</b>
            Блекаут тривав {{ blk_min }} хв, з них на резерві {{ res_min }} хв.{%
            else %}\U0001F7E2 <b>МЕРЕЖУ ВІДНОВЛЕНО.</b> На резерв не перемикались.
            Блекаут тривав {{ blk_min }} хв.{% endif %} Прилади повернуто до штатного
            режиму, бойлер за розкладом."
          parse_mode: html
    - alias: Станцію визначено
      conditions:
      - condition: trigger
        id: stantsiia
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state:
        - Резерв
        - Резерв (мережа є)
      sequence:
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: "\U0001F50C <b>Станція: {{ to }}.</b> {% if to == 'Delta 2' %}Заряд
            {{ states('sensor.garderobna_delta_2_ble_battery_level') | float(0) |
            round(0) | int }}%.{% elif to == 'Delta 2 Max' %}Заряд {{ states('sensor.delta_2_max_battery_level')
            }}% (з хмари, оновлення рідкі).{% else %}Заряд за розрахунком {{ states('input_number.zegor_zariad')
            | float(0) | round(0) | int }}% (хмара EcoFlow за 20 хв не з'явилась).{%
            endif %} Навантаження {{ states('sensor.rezerv_s1_zhivlennia') | float(0)
            | round(0) | int }} Вт."
          parse_mode: html
    - alias: Перевантаження резерву
      conditions:
      - condition: trigger
        id: overload
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state:
        - Резерв
        - Резерв (мережа є)
      sequence:
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: "⚠️ <b>ПЕРЕВАНТАЖЕННЯ РЕЗЕРВУ:</b> {{ states('sensor.rezerv_s1_zhivlennia')
            | float(0) | round(0) | int }} Вт (понад 1000 Вт). Станція: {{ station
            }}.\n\U0001F449 <i>Вимкніть потужні прилади (чайник, фен, плиту).</i>"
          parse_mode: html
    - alias: Бойлер увімкнувся не в стані Мережа
      conditions:
      - condition: trigger
        id: boiler_on
      - condition: not
        conditions:
        - condition: state
          entity_id: input_select.stan_zhivlennia
          state: Мережа
      sequence:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.boiler
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: "\U0001F6AB <b>УВІМКНЕННЯ БОЙЛЕРА ЗАБЛОКОВАНО.</b> Стан живлення:
            {{ states('input_select.stan_zhivlennia') }}. Бойлер працює лише від міської
            мережі."
          parse_mode: html
    - alias: 'River нижче 45%: дозаряд від резерву'
      conditions:
      - condition: trigger
        id: river_low
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state:
        - Резерв
        - Резерв (мережа є)
      sequence:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.river_600_in
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: ⚠️ <b>[РЕЗЕРВ] River досяг 45%.</b> Розетку увімкнено для дозарядки
            від станції ({{ station }}).
          parse_mode: html
    - alias: 'River 80%: вимкнути дозаряд'
      conditions:
      - condition: trigger
        id: river_charged
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state:
        - Резерв
        - Резерв (мережа є)
      sequence:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.river_600_in
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: "\U0001F50B <b>River заряджено до 80%.</b> Розетку вимкнено, щоб
            берегти станцію."
          parse_mode: html
    - alias: Заряд активної станції 20% або 10%
      conditions:
      - condition: trigger
        id:
        - soc_delta2_20
        - soc_delta2_10
        - soc_delta2max_20
        - soc_delta2max_10
        - soc_zegor_20
        - soc_zegor_10
      - condition: template
        value_template: '{% set map = {''soc_delta2'': ''Delta 2'', ''soc_delta2max'':
          ''Delta 2 Max'', ''soc_zegor'': ''ZEGOR''} %}{{ map.get(trigger.id.rsplit(''_'',
          1)[0]) == station }}'
      sequence:
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: "{% if trigger.id.endswith('_10') %}\U0001F534 <b>[КРИТИЧНО] {{
            station }}: заряд менше 10%!</b> Негайно підключіть іншу станцію через
            S1.{% else %}\U0001F7E1 <b>[РЕЗЕРВ] {{ station }}: заряд 20%.</b> Підготуйте
            наступну станцію.{% endif %}"
          parse_mode: html
    - alias: 'Нагадування: мережа є, квартира на станції'
      conditions:
      - condition: trigger
        id: nahaduvannia
      - condition: state
        entity_id: input_select.stan_zhivlennia
        for:
          minutes: 10
        state: Резерв (мережа є)
      sequence:
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: ⏰ <b>Нагадування:</b> мережа є вже {{ ((now() - states.input_select.stan_zhivlennia.last_changed).total_seconds()
            / 60) | int }} хв, а квартира досі на станції ({{ station }}). Переведіть
            I-0-II на <b>МЕРЕЖУ</b>.
          parse_mode: html
    - alias: 10 хв без світла без резерву
      conditions:
      - condition: trigger
        id: blekaut_10hv
      sequence:
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 605056541
          message: ⏰ <b>10 хв без світла, на резерв не перемкнулись.</b> Заряд сервера
            {{ bat }}% (на батареї приблизно 2 год від 80%).
          parse_mode: html
  max: 10
  mode: queued
  variables:
    bat: '{{ states(''sensor.system_monitor_battery'') }}'
    blk_min: '{{ ((now().timestamp() - as_timestamp(states(''input_datetime.pochatok_blekautu''),
      now().timestamp())) / 60) | round(0) | int }}'
    frm: '{{ trigger.from_state.state if trigger.from_state is defined and trigger.from_state
      is not none else '''' }}'
    grid_now: '{% set vs = states.sensor.vvidnii_shchitok_napruga %}{{ is_number(vs.state)
      and vs.state | float(0) > 195 and (now() - vs.last_reported).total_seconds()
      < 75 }}'
    res_min: '{{ ((now().timestamp() - as_timestamp(states(''input_datetime.pochatok_rezervu''),
      now().timestamp())) / 60) | round(0) | int }}'
    res_used: '{{ as_timestamp(states(''input_datetime.pochatok_rezervu''), 0) >=
      as_timestamp(states(''input_datetime.pochatok_blekautu''), 0) }}'
    station: '{{ states(''input_select.aktivna_stantsiia'') }}'
    to: '{{ trigger.to_state.state if trigger.to_state is defined and trigger.to_state
      is not none else '''' }}'
    v_now: '{{ states(''sensor.vvidnii_shchitok_napruga'') }}'
  trace:
    stored_traces: 20
- id: '1793713336341'
  alias: 'Водопостачання: Фіксація заміни фільтра'
  description: Записує поточну дату заміни картриджа без надсилання зайвих повідомлень
  triggers:
  - trigger: state
    entity_id: input_button.skidannia_resursu_filtra_vodi
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.data_ostannoi_zamini_filtra_vodi
    data:
      date: '{{ now().strftime(''%Y-%m-%d'') }}'
  mode: single
- id: power_state_machine
  alias: 'Електромережа: Стан живлення'
  description: 'P5b (27.11.2026). Єдине джерело правди про живлення квартири: input_select.stan_zhivlennia
    (Мережа / Блекаут / Резерв / Резерв (мережа є)). Сигнали: Ж = ультрабук заряджається
    (лінія квартири під напругою); М = TOMZN понад 195 В зі свіжими пакетами (до 75
    с); С = споживання з мережі понад 60 Вт; Р = Atorch S1 понад 30 Вт (станція живить
    квартиру). Синхронізує input_boolean.rezhim_blekautu (on у всіх станах, крім Мережа).
    Дії та сповіщення виконує окрема автоматизація. Виправлення 27.11 (тест А): мережа
    є, квартира живлена, з мережі менше 60 Вт, S1 офлайн = Резерв (мережа є) і зі
    стану Мережа (раніше чекали S1).'
  triggers:
  - entity_id:
    - binary_sensor.system_monitor_charging
    - sensor.vvidnii_shchitok_napruga
    - sensor.vvidnii_shchitok_zhivlennia
    to:
    trigger: state
  - trigger: numeric_state
    entity_id: sensor.rezerv_s1_zhivlennia
    above: 30
  - trigger: numeric_state
    entity_id: sensor.rezerv_s1_zhivlennia
    below: 30
  - trigger: state
    entity_id: sensor.rezerv_s1_zhivlennia
    to:
    - unavailable
    - unknown
  - trigger: state
    entity_id: sensor.rezerv_s1_zhivlennia
    from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - seconds: /15
    trigger: time_pattern
  - event: start
    trigger: homeassistant
  conditions:
  - condition: template
    value_template: '{{ target != cur and target in [''Мережа'', ''Блекаут'', ''Резерв'',
      ''Резерв (мережа є)''] }}'
  actions:
  - alias: Фіксація початку блекауту (вихід зі стану Мережа)
    if:
    - condition: state
      entity_id: input_select.stan_zhivlennia
      state: Мережа
    then:
    - action: input_datetime.set_datetime
      data:
        timestamp: '{{ now().timestamp() }}'
      target:
        entity_id: input_datetime.pochatok_blekautu
  - alias: Фіксація першого переходу на резерв у цьому блекауті
    if:
    - condition: template
      value_template: '{{ target in [''Резерв'', ''Резерв (мережа є)''] and as_timestamp(states(''input_datetime.pochatok_rezervu''),
        0) < as_timestamp(states(''input_datetime.pochatok_blekautu''), 0) }}'
    then:
    - action: input_datetime.set_datetime
      data:
        timestamp: '{{ now().timestamp() }}'
      target:
        entity_id: input_datetime.pochatok_rezervu
  - alias: Синхронізація режиму блекауту
    else:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.rezhim_blekautu
    if:
    - condition: template
      value_template: '{{ target == ''Мережа'' }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.rezhim_blekautu
  - action: input_select.select_option
    data:
      option: '{{ target }}'
    target:
      entity_id: input_select.stan_zhivlennia
  max: 10
  mode: queued
  variables:
    cur: '{{ states(''input_select.stan_zhivlennia'') }}'
    target: '{% set cur = states(''input_select.stan_zhivlennia'') %}{% set zs = states.binary_sensor.system_monitor_charging
      %}{% set zh = zs.state != ''off'' %}{% set zh_age = (now() - zs.last_changed).total_seconds()
      %}{% set vs = states.sensor.vvidnii_shchitok_napruga %}{% set v_num = is_number(vs.state)
      %}{% set v_age = (now() - vs.last_reported).total_seconds() %}{% set v_chg_age
      = (now() - vs.last_changed).total_seconds() %}{% set m = v_num and vs.state
      | float(0) > 195 and v_age < 75 %}{% set m_absent = (not v_num and v_chg_age
      >= 45) or v_age >= 75 or (v_num and vs.state | float(0) < 170 and v_chg_age
      >= 10) %}{% set c = m and states(''sensor.vvidnii_shchitok_zhivlennia'') | float(0)
      > 0.06 %}{% set s1_ok = is_number(states(''sensor.rezerv_s1_zhivlennia'')) %}{%
      set r = states(''sensor.rezerv_s1_zhivlennia'') | float(0) > 30 %}{% set res
      = [''Резерв'', ''Резерв (мережа є)''] %}{% if not zh %}{% if zh_age < 30 %}{{
      cur }}{% elif m and c %}Мережа{% elif m_absent or (m and not c) %}Блекаут{%
      else %}{{ cur }}{% endif %}{% else %}{% if r %}{% if m %}Резерв (мережа є){%
      elif m_absent %}Резерв{% else %}{{ cur if cur in res else ''Резерв'' }}{% endif
      %}{% elif m and (c or s1_ok) %}Мережа{% elif m %}Резерв (мережа є){% elif m_absent
      %}{% if cur == ''Мережа'' %}Мережа{% elif cur == ''Блекаут'' and zh_age < 120
      %}Блекаут{% else %}Резерв{% endif %}{% else %}{{ cur }}{% endif %}{% endif %}'
  trace:
    stored_traces: 20
- id: reserve_station_detect
  alias: 'Резерв: Визначення станції та облік ZEGOR'
  description: 'P5b (27.11.2026, v2). Визначає активну станцію (input_select.aktivna_stantsiia).
    Відлік від моменту, коли S1 вийшла на зв''язок (input_datetime.s1_na_zv_iazku_z
    = станцію ввімкнули): Delta 2, якщо Bluetooth показує вихід AC понад 30 Вт; Delta
    2 Max, якщо після ввімкнення станції хмара показала вихід Delta 2 Max понад 30
    Вт; ZEGOR, якщо через 20 хв після першого навантаження (input_datetime.pochatok_navantazhennia_s1)
    хмара мовчить. Коротке перемикання мережа/резерв станцію не скидає. Облік ZEGOR:
    енергія S1 віднімається від input_number.zegor_zariad (2.621 кВт·год = 100%),
    лише коли активна ZEGOR; при визначенні ZEGOR віднімається енергія від останньої
    точки обліку. При виході S1 на зв''язок вмикає Fast refresh (оновлення раз на
    секунду). Поки стан не Мережа, а S1 офлайн, щохвилини перепідключає S1. Fast refresh
    на S1 сам вимикається через 5 хв: автоматизація вмикає його знову, поки стан не
    Мережа або S1 понад 30 Вт.'
  triggers:
  - entity_id: sensor.rezerv_s1_zhivlennia
    from:
    - unavailable
    - unknown
    id: s1_online
    not_to:
    - unavailable
    - unknown
    trigger: state
  - above: 30
    entity_id: sensor.rezerv_s1_zhivlennia
    id: load_start
    trigger: numeric_state
  - entity_id: sensor.rezerv_s1_energiia
    id: energy
    to:
    trigger: state
  - entity_id: switch.rezerv_s1_fast_refresh
    for:
      seconds: 3
    id: fast_off
    to: 'off'
    trigger: state
  - entity_id:
    - input_select.stan_zhivlennia
    - sensor.delta_2_max_total_out_power
    id: recalc
    to:
    trigger: state
  - above: 30
    entity_id: sensor.garderobna_delta_2_ble_ac_output_power
    id: recalc
    trigger: numeric_state
  - below: 30
    entity_id: sensor.garderobna_delta_2_ble_ac_output_power
    id: recalc
    trigger: numeric_state
  - below: 30
    entity_id: sensor.rezerv_s1_zhivlennia
    id: recalc
    trigger: numeric_state
  - entity_id: sensor.rezerv_s1_zhivlennia
    id: recalc
    to:
    - unavailable
    - unknown
    trigger: state
  - id: recalc
    minutes: /1
    trigger: time_pattern
  - id: s1_wake
    minutes: /1
    seconds: 30
    trigger: time_pattern
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id:
      - s1_online
      - load_start
      - energy
      - fast_off
    - condition: state
      entity_id: input_select.stan_zhivlennia
      state:
      - Блекаут
      - Резерв
      - Резерв (мережа є)
    - condition: not
      conditions:
      - condition: state
        entity_id: input_select.aktivna_stantsiia
        state: Немає
  actions:
  - choose:
    - alias: 'S1 вийшла на зв''язок (станцію ввімкнули): час, Fast refresh, старт
        навантаження'
      conditions:
      - condition: trigger
        id: s1_online
      sequence:
      - action: input_datetime.set_datetime
        data:
          timestamp: '{{ now().timestamp() }}'
        target:
          entity_id: input_datetime.s1_na_zv_iazku_z
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.rezerv_s1_fast_refresh
      - if:
        - above: 30
          condition: numeric_state
          entity_id: sensor.rezerv_s1_zhivlennia
        then:
        - action: input_datetime.set_datetime
          data:
            timestamp: '{{ now().timestamp() }}'
          target:
            entity_id: input_datetime.pochatok_navantazhennia_s1
        - if:
          - condition: template
            value_template: '{{ is_number(states(''sensor.rezerv_s1_energiia'')) }}'
          then:
          - action: input_number.set_value
            data:
              value: '{{ states(''sensor.rezerv_s1_energiia'') | float }}'
            target:
              entity_id: input_number.s1_energiia_na_starti_navantazhennia
    - alias: 'Fast refresh вимкнувся: увімкнути знову'
      conditions:
      - condition: trigger
        id: fast_off
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.rezerv_s1_zhivlennia
          state:
          - unavailable
          - unknown
      - condition: or
        conditions:
        - condition: not
          conditions:
          - condition: state
            entity_id: input_select.stan_zhivlennia
            state: Мережа
        - condition: numeric_state
          entity_id: sensor.rezerv_s1_zhivlennia
          above: 30
      sequence:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.rezerv_s1_fast_refresh
    - alias: 'Навантаження через S1: увімкнути Fast refresh'
      conditions:
      - condition: trigger
        id: load_start
      - condition: state
        entity_id: switch.rezerv_s1_fast_refresh
        state: 'off'
      sequence:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.rezerv_s1_fast_refresh
      - condition: template
        value_template: '{{ as_timestamp(states(''input_datetime.pochatok_navantazhennia_s1''),
          0) < as_timestamp(states(''input_datetime.s1_na_zv_iazku_z''), 0) }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.pochatok_navantazhennia_s1
        data:
          timestamp: '{{ now().timestamp() }}'
      - if:
        - condition: template
          value_template: '{{ is_number(states(''sensor.rezerv_s1_energiia'')) }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.s1_energiia_na_starti_navantazhennia
          data:
            value: '{{ states(''sensor.rezerv_s1_energiia'') | float }}'
    - alias: Перше навантаження після ввімкнення станції
      conditions:
      - condition: trigger
        id: load_start
      - condition: template
        value_template: '{{ as_timestamp(states(''input_datetime.pochatok_navantazhennia_s1''),
          0) < as_timestamp(states(''input_datetime.s1_na_zv_iazku_z''), 0) }}'
      sequence:
      - action: input_datetime.set_datetime
        data:
          timestamp: '{{ now().timestamp() }}'
        target:
          entity_id: input_datetime.pochatok_navantazhennia_s1
      - if:
        - condition: template
          value_template: '{{ is_number(states(''sensor.rezerv_s1_energiia'')) }}'
        then:
        - action: input_number.set_value
          data:
            value: '{{ states(''sensor.rezerv_s1_energiia'') | float }}'
          target:
            entity_id: input_number.s1_energiia_na_starti_navantazhennia
    - alias: Облік заряду ZEGOR за приростом енергії S1
      conditions:
      - condition: trigger
        id: energy
      - condition: state
        entity_id: input_select.aktivna_stantsiia
        state: ZEGOR
      - condition: template
        value_template: '{{ is_number(trigger.from_state.state) and is_number(trigger.to_state.state)
          and (trigger.to_state.state | float - trigger.from_state.state | float)
          > 0 and (trigger.to_state.state | float - trigger.from_state.state | float)
          < 1 }}'
      sequence:
      - action: input_number.set_value
        data:
          value: '{{ [0, states(''input_number.zegor_zariad'') | float(0) - (trigger.to_state.state
            | float - trigger.from_state.state | float) / 2.621 * 100] | max | round(1)
            }}'
        target:
          entity_id: input_number.zegor_zariad
      - action: input_number.set_value
        data:
          value: '{{ trigger.to_state.state | float }}'
        target:
          entity_id: input_number.s1_energiia_na_starti_navantazhennia
    - alias: Перерахунок активної станції
      conditions:
      - condition: trigger
        id: recalc
      sequence:
      - variables:
          new: '{% set st = states(''input_select.stan_zhivlennia'') %}{% set inres
            = st in [''Резерв'', ''Резерв (мережа є)''] %}{% set s1w = states(''sensor.rezerv_s1_zhivlennia'')
            | float(0) %}{% set d2 = states(''sensor.garderobna_delta_2_ble_ac_output_power'')
            | float(0) > 30 %}{% set s1on = as_timestamp(states(''input_datetime.s1_na_zv_iazku_z''),
            0) %}{% set t0 = as_timestamp(states(''input_datetime.pochatok_navantazhennia_s1''),
            0) %}{% set ms = states.sensor.delta_2_max_total_out_power %}{% set d2m
            = ms is not none and ms.state | float(0) > 30 and as_timestamp(ms.last_reported)
            >= s1on %}{% set age = now().timestamp() - t0 %}{% set cur = states(''input_select.aktivna_stantsiia'')
            %}{% if not inres %}Немає{% elif d2 %}Delta 2{% elif s1w > 30 and d2m
            %}Delta 2 Max{% elif s1w > 30 and t0 >= s1on and age >= 1200 %}ZEGOR{%
            elif s1w > 30 %}Delta 2 Max або ZEGOR{% elif cur in [''Delta 2'', ''Delta
            2 Max'', ''ZEGOR''] %}{{ cur }}{% else %}Невідомо{% endif %}'
          old: '{{ states(''input_select.aktivna_stantsiia'') }}'
      - condition: template
        value_template: '{{ new != old }}'
      - if:
        - condition: template
          value_template: '{{ new == ''ZEGOR'' and is_number(states(''sensor.rezerv_s1_energiia''))
            }}'
        then:
        - action: input_number.set_value
          alias: Відняти енергію від останньої точки обліку
          data:
            value: '{% set de = states(''sensor.rezerv_s1_energiia'') | float - states(''input_number.s1_energiia_na_starti_navantazhennia'')
              | float(0) %}{% set de = de if 0 < de < 3 else 0 %}{{ [0, states(''input_number.zegor_zariad'')
              | float(0) - de / 2.621 * 100] | max | round(1) }}'
          target:
            entity_id: input_number.zegor_zariad
        - action: input_number.set_value
          data:
            value: '{{ states(''sensor.rezerv_s1_energiia'') | float }}'
          target:
            entity_id: input_number.s1_energiia_na_starti_navantazhennia
      - action: input_select.select_option
        data:
          option: '{{ new }}'
        target:
          entity_id: input_select.aktivna_stantsiia
    - alias: 'S1 офлайн під час блекауту або резерву: примусово перепідключити'
      conditions:
      - condition: trigger
        id: s1_wake
      - condition: state
        entity_id: input_select.stan_zhivlennia
        state:
        - Блекаут
        - Резерв
        - Резерв (мережа є)
      - condition: state
        entity_id: sensor.rezerv_s1_zhivlennia
        state:
        - unavailable
        - unknown
      sequence:
      - action: homeassistant.reload_config_entry
        continue_on_error: true
        data:
          entry_id: 01M53GWN16HK7WQPQMBFH2DFFC
  max: 10
  mode: queued
  trace:
    stored_traces: 20
- id: '1795805849916'
  alias: 'Холодильник: Контроль дверцят за роботою компресора'
  description: 'Розетка ЕнерджіВампір (холодильник). Норма за даними 21-27.11: компресор
    працює 50-70 хв, стоїть 50-55 хв, частка роботи ~50%. Безперервна робота 2,5 год
    від звичайного старту = відхилення (ймовірно, нещільно зачинені дверцята). Після
    відновлення живлення розетки (запуск з unknown/unavailable) перше попередження
    пропускається, бо холодильник доганяє температуру; 4 год і 8 год повідомляються
    завжди. Кожне відхилення рахується в counter.kholodilnik_vidkhilennia.'
  triggers:
  - entity_id: binary_sensor.kholodilnik_kompresor
    for:
      hours: 2
      minutes: 30
    from: 'off'
    id: dovgo
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.kholodilnik_kompresor
    for:
      hours: 4
    id: duzhe_dovgo
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.kholodilnik_kompresor
    for:
      hours: 8
    id: kritychno
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.kholodilnik_kompresor
    from: 'on'
    id: zupynka
    to: 'off'
    trigger: state
  - entity_id: binary_sensor.kholodilnik_kompresor
    for:
      minutes: 10
    id: zviazok
    to:
    - unavailable
    - unknown
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - dovgo
        - duzhe_dovgo
        - kritychno
      sequence:
      - variables:
          hodyn: '{{ {''dovgo'': ''2,5'', ''duzhe_dovgo'': ''4'', ''kritychno'': ''8''}[trigger.id]
            }}'
          tekst: "{% if trigger.id == 'dovgo' %}\U0001F9CA <b>Холодильник</b>: компресор
            працює без зупинки вже <b>2,5 год</b> (норма до 1 год 10 хв).\nПеревірте,
            чи щільно зачинені дверцята.{% elif trigger.id == 'duzhe_dovgo' %}⚠️ <b>Холодильник</b>:
            компресор працює без зупинки вже <b>4 год</b>.\nЙмовірно, відчинені дверцята
            або завантажено багато теплих продуктів. Перевірте дверцята й ущільнювач.{%
            else %}\U0001F534 <b>Холодильник</b>: компресор працює без зупинки вже
            <b>8 год</b>.\nЦе вже не схоже на норму: перевірте дверцята, ущільнювач,
            температуру всередині, вентиляцію задньої стінки.{% endif %}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.kholodilnik_vidkhilennia_trivaie
      - action: logbook.log
        data:
          entity_id: binary_sensor.kholodilnik_kompresor
          message: Компресор працює без зупинки {{ hodyn }} год
          name: Холодильник
      - action: telegram_bot.send_message
        data:
          chat_id: 605056541
          message: '{{ tekst }}'
          parse_mode: html
    - conditions:
      - condition: trigger
        id: zupynka
      - condition: state
        entity_id: input_boolean.kholodilnik_vidkhilennia_trivaie
        state: 'on'
      sequence:
      - variables:
          khv: '{{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
            / 60) | round(0) | int }}'
      - action: counter.increment
        target:
          entity_id: counter.kholodilnik_vidkhilennia
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kholodilnik_vidkhilennia_trivaie
      - action: logbook.log
        data:
          entity_id: binary_sensor.kholodilnik_kompresor
          message: 'Відхилення завершено: безперервна робота {{ khv // 60 }} год {{
            khv % 60 }} хв'
          name: Холодильник
      - action: telegram_bot.send_message
        data:
          chat_id: 605056541
          message: '✅ <b>Холодильник</b>: компресор зупинився після {{ khv // 60 }}
            год {{ khv % 60 }} хв безперервної роботи.

            Відхилення зафіксовано (усього: {{ states(''counter.kholodilnik_vidkhilennia'')
            }}).'
          parse_mode: html
    - conditions:
      - condition: trigger
        id: zviazok
      - condition: state
        entity_id: input_boolean.kholodilnik_vidkhilennia_trivaie
        state: 'on'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.kholodilnik_vidkhilennia
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kholodilnik_vidkhilennia_trivaie
      - action: logbook.log
        data:
          entity_id: binary_sensor.kholodilnik_kompresor
          message: 'Відхилення закрито без підсумку: розетка холодильника недоступна
            10 хв'
          name: Холодильник
  max: 5
  mode: queued
- id: '1795813542005'
  alias: 'Сервіс: Нагадування про обслуговування бойлера'
  description: 'Рахує дні до обслуговування (sensor.boiler_dniv_do_obslugovuvannia
    = дата останнього обслуговування + інтервал у місяцях). Нагадує в Telegram о 10:00
    за 30, 14, 7, 1 і 0 днів, після строку щотижня. Кнопка input_button.boiler_obslugovuvannia_vikonano
    записує сьогоднішню дату. Останнє обслуговування: 12.10.2026 (заміна магнієвого
    анода, чистка від накипу).'
  triggers:
  - at: '10:00:00'
    id: perevirka
    trigger: time
  - entity_id: input_button.boiler_obslugovuvannia_vikonano
    id: vykonano
    not_from:
    - unavailable
    - unknown
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: vykonano
      sequence:
      - action: input_datetime.set_datetime
        data:
          date: '{{ now().date() }}'
        target:
          entity_id: input_datetime.boiler_data_obslugovuvannia
      - delay:
          seconds: 2
      - action: telegram_bot.send_message
        data:
          chat_id: 605056541
          message: "\U0001F6E0 <b>Бойлер</b>: обслуговування зафіксовано {{ now().strftime('%d.%m.%Y')
            }}.\nНаступне через {{ states('input_number.boiler_interval_obslugovuvannia')
            | int }} міс (через {{ states('sensor.boiler_dniv_do_obslugovuvannia')
            }} дн)."
          parse_mode: html
    - conditions:
      - condition: trigger
        id: perevirka
      - condition: template
        value_template: '{% set n = states(''sensor.boiler_dniv_do_obslugovuvannia'')
          | int(999) %}{{ n in [30, 14, 7, 1, 0] or (n < 0 and n % 7 == 0) }}'
      sequence:
      - variables:
          dni: '{{ states(''sensor.boiler_dniv_do_obslugovuvannia'') | int }}'
      - action: telegram_bot.send_message
        data:
          chat_id: 605056541
          message: "{% if dni > 0 %}\U0001F6E0 <b>Бойлер</b>: до планового обслуговування
            {{ dni }} дн.{% elif dni == 0 %}\U0001F6E0 <b>Бойлер</b>: сьогодні час
            планового обслуговування.{% else %}⚠️ <b>Бойлер</b>: обслуговування прострочене
            на {{ -dni }} дн.{% endif %}\nОстаннє: {{ as_datetime(states('input_datetime.boiler_data_obslugovuvannia')).strftime('%d.%m.%Y')
            }}.\nЩо зробити: перевірити магнієвий анод (замінити, якщо зношений більш
            ніж наполовину), почистити бак і ТЕН від накипу, перевірити запобіжний
            клапан і положення ручки термостата.\nПісля робіт натисніть «Бойлер: обслуговування
            виконано»."
          parse_mode: html
  mode: single
