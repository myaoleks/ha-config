zegor_f_ksats_ia_startu_roboti:
  alias: 'ZEGOR: Заряджено до 100%'
  description: 'P5b (27.11.2026): після повного заряду ZEGOR встановлює розрахунковий
    заряд input_number.zegor_zariad = 100%. Стара логіка фіксації стартових кВт більше
    не потрібна: облік веде автоматизація «Резерв: Визначення станції та облік ZEGOR».'
  icon: mdi:battery-check
  mode: single
  sequence:
  - action: input_number.set_value
    data:
      value: 100
    target:
      entity_id: input_number.zegor_zariad
skidannia_filtra_vodi:
  alias: 'Фільтр води: Скидання дати'
  sequence:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.data_ostannoi_zamini_filtra_vodi
    data:
      date: '{{ now().strftime(''%Y-%m-%d'') }}'
